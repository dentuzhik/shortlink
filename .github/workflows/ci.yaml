name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Application checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared database package
        run: pnpm --filter @url-shortener/db build
      - name: Lint
        run: pnpm lint
      - name: Type check all workspaces
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Release verification tests
        run: pnpm test:release
      - name: Build all workspaces
        run: pnpm build

  integration:
    name: Postgres and Redis integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify container runtime
        run: docker info
      - name: Run migrations and integration tests on disposable databases
        run: pnpm test:integration

  images:
    name: Container image (${{ matrix.target }}, ${{ matrix.platform.arch }})
    needs: [checks, integration]
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [redirect, web]
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}-${{ matrix.target }}
      REVISION: ${{ github.sha }}
      ARCH: ${{ matrix.platform.arch }}
      PLATFORM_TAG: ${{ github.sha }}-${{ matrix.platform.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR for trusted main builds
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build native image once
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.platform.arch }}
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
          provenance: mode=max
          tags: ${{ env.IMAGE_NAME }}:${{ env.PLATFORM_TAG }}
          build-args: |
            APP_REVISION=${{ env.REVISION }}
          labels: |
            org.opencontainers.image.revision=${{ env.REVISION }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=image-${{ matrix.target }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.target }}-${{ matrix.platform.arch }}
      - name: Verify native image and baked revision
        env:
          PUBLISHED: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          if [ "$PUBLISHED" = "true" ]; then
            docker pull --platform "linux/$ARCH" "$IMAGE_NAME:$PLATFORM_TAG"
          fi
          actual_revision=$(docker image inspect "$IMAGE_NAME:$PLATFORM_TAG" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          actual_arch=$(docker image inspect "$IMAGE_NAME:$PLATFORM_TAG" --format '{{ .Architecture }}')
          test "$actual_revision" = "$REVISION"
          test "$actual_arch" = "$ARCH"
          docker run --rm --entrypoint node "$IMAGE_NAME:$PLATFORM_TAG" \
            -e 'if (process.env.APP_REVISION !== process.argv[1]) throw new Error("Image revision mismatch")' \
            "$REVISION"
      - name: Verify one web image with two runtime hostnames
        if: matrix.target == 'web'
        run: node scripts/verify-web-image.mjs "$IMAGE_NAME:$PLATFORM_TAG"
      - name: Record the verified platform artifact and its provenance index
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          INDEX_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p .image-digests
          docker buildx imagetools inspect "$IMAGE_NAME@$INDEX_DIGEST" --raw > .image-digests/index.json
          digest=$(jq -er --arg arch "$ARCH" '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch)] | if length == 1 then .[0].digest else error("Expected one native platform") end' .image-digests/index.json)
          jq -n --arg image "$IMAGE_NAME" --arg revision "$REVISION" \
            --arg platform "linux/$ARCH" --arg digest "$digest" --arg indexDigest "$INDEX_DIGEST" \
            '{image: $image, revision: $revision, platform: $platform, digest: $digest, indexDigest: $indexDigest}' \
            > ".image-digests/$ARCH.json"
          rm .image-digests/index.json
      - name: Retain verified digest for the manifest job
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.target }}-${{ matrix.platform.arch }}
          path: .image-digests/*.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  publish:
    name: Publish multi-platform image (${{ matrix.target }})
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [images]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [redirect, web]
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}-${{ matrix.target }}
      REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-${{ matrix.target }}-*
          path: .image-digests
          merge-multiple: true
      - name: Combine the exact verified digests and record the index
        run: node scripts/publish-image-index.mjs "$IMAGE_NAME" "$REVISION" .image-digests
      - name: Retain published manifest metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-${{ matrix.target }}
          path: .image-digests/published.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
