name: url-shortener

x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env first}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
  POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env first}

x-redirect-image: &redirect-image
  image: shortlink-redirect:local
  build:
    context: .
    target: redirect

services:
  postgres:
    image: postgres:18.6
    environment: *postgres-env
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
        ]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  redis:
    image: redis:8.10.3-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  migrate:
    <<: *redirect-image
    command: ["pnpm", "db:migrate"]
    environment:
      <<: *postgres-env
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy

  redirect-service:
    <<: *redirect-image
    environment:
      <<: *postgres-env
      POSTGRES_HOST: postgres
      REDIS_URL: ${REDIS_URL-redis://redis:6379}
      REDIS_CACHE_HEADER: ${REDIS_CACHE_HEADER:-0}
      REDIRECT_DB_MAX_WAITERS: ${REDIRECT_DB_MAX_WAITERS:-128}
      REDIRECT_DB_CHECKOUT_TIMEOUT_MS: ${REDIRECT_DB_CHECKOUT_TIMEOUT_MS:-50}
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/readyz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 20

  web:
    image: shortlink-web:local
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:3101:3001"
    depends_on:
      redirect-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
