# This local cluster has one kind node sharing Colima's Linux kernel.
# These /proc collectors report VM-wide counters, verified against `colima ssh`.
# Other host-dependent collectors are deliberately disabled.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vm-metrics
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vm-metrics
  template:
    metadata:
      labels:
        app: vm-metrics
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: shortlink-control-plane
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.12.1
          args:
            - --collector.disable-defaults
            - --collector.cpu
            - --collector.meminfo
            - --collector.pressure
            - --collector.loadavg
          ports:
            - name: metrics
              containerPort: 9100
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: vm-metrics
spec:
  selector:
    app: vm-metrics
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-state-metrics
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: shortlink-cluster-state-metrics
rules:
  - apiGroups: [""]
    resources: [nodes, pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: shortlink-cluster-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: shortlink-cluster-state-metrics
subjects:
  - kind: ServiceAccount
    name: cluster-state-metrics
    namespace: shortlink
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-state-metrics
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cluster-state-metrics
  template:
    metadata:
      labels:
        app: cluster-state-metrics
    spec:
      serviceAccountName: cluster-state-metrics
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0
          args:
            - --resources=nodes,pods
            - --metric-allowlist=kube_node_status_capacity,kube_node_status_allocatable,kube_pod_container_info,kube_pod_container_resource_requests,kube_pod_container_resource_limits,kube_pod_container_status_restarts_total,kube_pod_status_phase,kube_pod_status_ready
          ports:
            - name: metrics
              containerPort: 8080
            - name: telemetry
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: telemetry
            initialDelaySeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: cluster-state-metrics
spec:
  selector:
    app: cluster-state-metrics
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
---
# Prometheus reads kubelet metrics directly over verified TLS. No nodes/proxy
# permission is needed; this token cannot use the API server's node proxy.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: shortlink-prometheus-node-metrics
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes/metrics]
    resourceNames: [shortlink-control-plane]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: shortlink-prometheus-node-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: shortlink-prometheus-node-metrics
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: shortlink
