apiVersion: v1
kind: ServiceAccount
metadata:
  name: redirect-runtime-control
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: redirect-runtime-control
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["shortlink-runtime"]
    verbs: ["get", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: redirect-runtime-control
subjects:
  - kind: ServiceAccount
    name: redirect-runtime-control
    namespace: shortlink
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: redirect-runtime-control
