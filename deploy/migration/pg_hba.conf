# Migration login: verified-TLS clients only, one database, no physical protocol.
local all all trust
local replication all trust
hostssl shortener shortlink_migrator all scram-sha-256
host all shortlink_migrator all reject
host replication shortlink_migrator all reject
# Preserve existing application/local administration authentication.
host all all 127.0.0.1/32 trust
host all all ::1/128 trust
host replication all 127.0.0.1/32 trust
host replication all ::1/128 trust
host all all all scram-sha-256
