# STAGED ONLY: apply once TLS, reverse routing and VM sizing are ready.
# Changing this Pod template restarts the single source Postgres Deployment.
spec:
  template:
    spec:
      containers:
        - name: postgres
          args:
            - postgres
            - -c
            - wal_level=logical
            - -c
            - max_replication_slots=10
            - -c
            - max_wal_senders=10
            - -c
            - max_slot_wal_keep_size=128MB
