global:
  scrape_interval: 15s
  scrape_timeout: 8s
  evaluation_interval: 30s

scrape_configs:
  - job_name: nodes
    file_sd_configs:
      - files: [/opt/clusterctrl-monitoring/targets.json]
        refresh_interval: 30s
  - job_name: prometheus
    static_configs:
      - targets: [127.0.0.1:9090]
