# Dedicated disposable test stack: no development volumes or fixed host ports.
x-api: &api
  image: ${E2E_API_IMAGE:?Set by test-e2e-containers.mjs}
  build:
    context: ../..
    target: redirect

x-database: &database
  POSTGRES_USER: e2e
  POSTGRES_PASSWORD: e2e-only
  POSTGRES_DB: shortlink_e2e

services:
  postgres:
    image: postgres:18.6
    environment: *database
    volumes:
      - test_database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e -d shortlink_e2e"]
      interval: 1s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8.10.3-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
  migrate:
    <<: *api
    command: ["pnpm", "db:migrate"]
    environment:
      <<: *database
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
  redirect-service:
    <<: *api
    environment:
      <<: *database
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379
    ports: ["127.0.0.1::3000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 1s
      timeout: 3s
      retries: 30
  web:
    image: ${E2E_WEB_IMAGE:?Set by test-e2e-containers.mjs}
    build:
      context: ../..
      target: web
    environment:
      SHORT_LINK_ORIGIN: ${E2E_REDIRECT_ORIGIN:-http://127.0.0.1:3000}
    ports: ["127.0.0.1::3001"]
    depends_on:
      redirect-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  test_database:
